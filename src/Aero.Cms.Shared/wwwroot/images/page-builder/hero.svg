<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Abstract blue and violet hero placeholder</title>
  <desc id="description">Layered gradients, soft circles, and a flowing grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.52" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="950" cy="120" r="430" fill="url(#glow)"/>
  <circle cx="180" cy="700" r="360" fill="url(#glow)" opacity="0.55"/>
  <path d="M-80 610C180 440 340 710 590 530S990 270 1280 430" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5"/>
  <path d="M-30 670C250 520 420 760 650 590S1010 340 1240 500" fill="none" stroke="#bfdbfe" stroke-opacity="0.45" stroke-width="2"/>
</svg>
